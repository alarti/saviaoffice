name: Build and Release SaviaOffice PDF (Windows)

on:
  push:
    branches:
      - pdf-only-fork
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PDF App (Vite)
        run: npm --workspace=apps/pdf run build

      - name: Package Windows Installer (.exe)
        shell: bash
        run: |
          ELECTRON_VER=$(node -p "require('./node_modules/electron/package.json').version")
          echo "Detected exact Electron version: $ELECTRON_VER"
          npx electron-builder --win --x64 --publish never -c.electronVersion="$ELECTRON_VER" --project apps/pdf
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaviaOffice-PDF-Windows-Installer
          path: apps/pdf/dist/*.exe
