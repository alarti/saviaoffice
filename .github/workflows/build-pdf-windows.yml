name: Build and Release SaviaOffice PDF (Windows)

on:
  push:
    branches:
      - pdf-only-fork
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PDF App (Windows Installer)
        run: |
          pnpm --filter ./apps/pdf build
          pnpm --filter ./apps/pdf exec electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaviaOffice-PDF-Windows-Installer
          path: apps/pdf/dist/*.exe
