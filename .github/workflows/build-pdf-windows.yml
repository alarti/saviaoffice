name: Build SaviaOffice PDF for Windows

on:
  push:
    branches:
      - pdf-only-fork
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build PDF application
        run: npm --workspace=apps/pdf run build

      - name: Package Windows installer
        shell: bash
        run: |
          ELECTRON_VER=$(node -p "require('./node_modules/electron/package.json').version")
          echo "Detected exact Electron version: $ELECTRON_VER"
          npx electron-builder --win --x64 --publish never --projectDir apps/pdf --config electron-builder.ci.yml -c.electronVersion="$ELECTRON_VER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaviaOffice-PDF-Windows-Installer
          if-no-files-found: error
          path: apps/pdf/dist/*.exe
